<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Sans-serif: Latin primary, Arabic fallback -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic</string></edit>
    <edit name="family" mode="append" binding="weak"><string>IBM Plex Sans Arabic</string></edit>
  </match>

  <!-- Serif: Latin primary, Arabic fallback -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Amiri</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Naskh Arabic</string></edit>
  </match>

  <!-- Monospace: Latin primary, Arabic fallback -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Iosevka Nerd Font</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>

  <!-- Force Arabic script codepoints to use a proper Arabic font regardless of active family -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic</string></edit>
  </match>

<match target="font">
  <edit name="antialias" mode="assign"><bool>true</bool></edit>
  <edit name="hinting" mode="assign"><bool>true</bool></edit>
  <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  <edit name="rgba" mode="assign"><const>rgb</const></edit>
  <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
</match>
</fontconfig>
